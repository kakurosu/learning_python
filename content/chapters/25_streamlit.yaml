id: 25
title: "Streamlit でダッシュボード"
phase: F
prerequisites: [12, 13]
learning_goals:
  - "Streamlit の基本コンポーネント (title / write / line_chart / slider) を使える"
  - "スクリプトの再実行モデルを理解する"
  - "サイドバーで操作 UI を作れる"

pages:
  - kind: sample
    title: "Streamlit とは"
    markdown: |
      ## Streamlit
      `streamlit run app.py` で起動すると、**スクリプトを書くだけで Web ダッシュボード** が立ち上がります。
      `st.title`, `st.write`, `st.line_chart`, `st.slider` などのコンポーネントを呼ぶだけ。

      この章では Streamlit を **動かす代わりに、コードの組み立て方を確認** します。
      実行は次のコマンドを別ターミナルで:

      ```
      streamlit run my_app.py
      ```
    sample_code: |
      # コンポーネント名を確認するだけ（実際の起動はしない）
      components = ["title", "write", "line_chart", "slider", "sidebar", "metric"]
      for c in components:
          print(f"st.{c}")
    runnable: true
    stickman: explain
    stickman_speech: "Streamlit は学習にも本番にも使える、軽量フレームワーク。"

  - kind: sample
    title: "シンプルな Streamlit アプリ（参考）"
    markdown: |
      ## 例: 株価ダッシュボード
      下のコードを `my_app.py` として保存し、`streamlit run my_app.py` で起動できます。
      このページでは実行はせず、構造を確認します。
    sample_code: |
      template = '''
      import streamlit as st
      import pandas as pd

      st.title("株価ダッシュボード")
      df = pd.read_csv("data/stock_prices.csv")
      ticker = st.selectbox("銘柄", ["AAA", "BBB"])
      st.line_chart(df[ticker])
      st.metric("最終値", float(df[ticker].iloc[-1]))
      '''
      print(len(template), "文字のテンプレート")
    runnable: true
    stickman: explain
    stickman_speech: "selectbox + line_chart + metric だけで、立派なダッシュボードに。"

  - kind: exercise
    title: "Streamlit のタイトルを書こう"
    prompt: |
      `st.title(...)` を呼ぶコードを文字列として作ります。
      タイトルとして使う文字列を `title_text` に入れてください。
    code_template: |
      title_text = {{slot:arg}}
      print("st.title(" + repr(title_text) + ")")
    blanks:
      - id: arg
        canonical_answer: '"株価ダッシュボード"'
        accept_patterns:
          - '^"株価ダッシュボード"$'
          - "^'株価ダッシュボード'$"
        hint: "文字列をクォートで囲む"
    test_cases:
      - kind: stdout_regex
        pattern: 'st\.title\(.株価ダッシュボード.\)'
    hints:
      - 'クォートで囲む。`"株価ダッシュボード"`'
      - '`"株価ダッシュボード"`'
    stickman_feedback:
      correct: "title はダッシュボードの顔。"
      wrong_hint1: '`"株価ダッシュボード"`'
      wrong_hint2: '`"株価ダッシュボード"`'
      wrong_hint3: '`"株価ダッシュボード"`'

  - kind: exercise
    title: "selectbox を組み立てよう"
    prompt: |
      `st.selectbox(ラベル, 選択肢のリスト)` の **選択肢** を埋めてください。
    code_template: |
      options = {{slot:options}}
      print("st.selectbox('銘柄', " + repr(options) + ")")
    blanks:
      - id: options
        canonical_answer: '["AAA", "BBB"]'
        accept_patterns:
          - '^\[\s*"AAA"\s*,\s*"BBB"\s*\]$'
          - "^\\[\\s*'AAA'\\s*,\\s*'BBB'\\s*\\]$"
        hint: "Python のリスト"
    test_cases:
      - kind: stdout_regex
        pattern: 'st\.selectbox.*AAA.*BBB'
    hints:
      - 'リストで `["AAA", "BBB"]`。'
      - '`["AAA", "BBB"]`'
    stickman_feedback:
      correct: "selectbox は最も使うインプットコンポーネント。"
      wrong_hint1: '`["AAA", "BBB"]`'
      wrong_hint2: '`["AAA", "BBB"]`'
      wrong_hint3: '`["AAA", "BBB"]`'

  - kind: exercise
    title: "slider のレンジを設定しよう"
    prompt: |
      `st.slider(ラベル, min, max, default)` の **min, max** を整数で入れてください。
      期間を **1 日〜30 日** で動かす想定です。
    code_template: |
      lo = {{slot:lo}}
      hi = {{slot:hi}}
      print("st.slider('期間', " + str(lo) + ", " + str(hi) + ", 7)")
    blanks:
      - id: lo
        canonical_answer: "1"
        accept_patterns: ['^1$']
      - id: hi
        canonical_answer: "30"
        accept_patterns: ['^30$']
    test_cases:
      - kind: stdout_regex
        pattern: 'st\.slider\([^)]*1, 30, 7\)'
    hints:
      - "`1` と `30`"
      - "`1` と `30`"
    stickman_feedback:
      correct: "slider はインタラクティブな調整に便利。"
      wrong_hint1: "`1` と `30`"
      wrong_hint2: "`1` と `30`"
      wrong_hint3: "`1` と `30`"
